name: Bug Report
description: File a bug report to help us improve SnowNinja
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen
      placeholder: Tell us what you did and what went wrong
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce?
      description: Provide the steps to reproduce the bug
      placeholder: |
        1. Run `snowninja`
        2. Type `/plan ...`
        3. ...
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. Ubuntu 22.04, macOS Sonoma
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SnowNinja Version
      placeholder: e.g. 0.1.0
    validations:
      required: true
